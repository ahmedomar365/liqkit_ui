name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub global activate melos
      - run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - run: dart pub get
      - run: melos run fmt:check
      - run: melos run analyze
      - run: melos run analyze:flutter
      - run: bash tooling/scripts/check_no_path_runtime_deps.sh

  generated-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - run: dart run tooling/gen/generate_canonical_dart.dart --check
      - run: dart run tooling/scripts/verify_provenance.dart
      - run: dart run tooling/scripts/audit_design_data.dart

  test-non-golden:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub global activate melos
      - if: runner.os != 'Windows'
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - if: runner.os == 'Windows'
        run: echo "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: dart pub get
      - working-directory: packages/liqkit_ui
        run: flutter test --exclude-tags=golden
      - working-directory: packages/liqkit_ui_tokens
        run: flutter test
      - working-directory: packages/liqkit_ui_assets
        run: flutter test

  goldens-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: packages/liqkit_ui
        run: flutter test --tags=golden

  goldens-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: packages/liqkit_ui
        run: flutter test --tags=golden

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: apps/showcase
        run: flutter build web --wasm --release

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: apps/demo
        run: flutter build apk --debug

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: apps/demo
        run: flutter build ios --no-codesign --debug

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart pub get
      - working-directory: apps/demo
        run: flutter build windows --debug
