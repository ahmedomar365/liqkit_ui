name: liqkit_ui_workspace
publish_to: none

environment:
  sdk: ^3.7.0

workspace:
  - packages/liqkit_ui_design_data
  - packages/liqkit_ui_tokens
  - packages/liqkit_ui_assets
  - packages/liqkit_ui
  - apps/showcase
  - apps/demo
  - apps/playground
  - tooling/gen
  - tooling/gen/snippet_generator
  - apps/docs_snippets

dev_dependencies:
  crypto: ^3.0.0
  melos: any
  very_good_analysis: ^7.0.0

melos:
  ide:
    intellij:
      enabled: false

  command:
    version:
      message: |
        chore(release): publish

        {new_package_versions}

  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings
      exec:
        concurrency: 4
      packageFilters:
        flutter: false
      description: Static analysis across all workspace packages.

    analyze:flutter:
      run: flutter analyze --fatal-infos --fatal-warnings
      exec:
        concurrency: 2
      packageFilters:
        flutter: true
      description: Static analysis for Flutter packages.

    test:
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test
      description: Flutter test in every Flutter package with a test/ folder.

    test:dart:
      run: dart test
      exec:
        concurrency: 4
      packageFilters:
        flutter: false
        dirExists: test
      description: Dart test in every pure-Dart package with a test/ folder.

    gen:capture:
      run: dart run tooling/gen/capture_canonical_tokens.dart
      description: Capture canonical iOS 26 tokens from variable-defs into canonical_tokens.json.

    gen:tokens:
      run: dart run tooling/gen/generate_canonical_dart.dart
      description: Generate typed Dart token classes from canonical_tokens.json.

    gen:check:
      run: dart run tooling/gen/generate_canonical_dart.dart --check
      description: CI check that the generated token classes are up to date.

    audit:design_data:
      run: dart run tooling/scripts/audit_design_data.dart
      description: Verify every liqkit category has all expected artifact types.

    audit:components:
      run: dart run tooling/scripts/check_component_audit.dart
      description: Verify docs/audits/ios26_component_checklist.md covers every exported Liq component.

    audit:components:strict:
      run: dart run tooling/scripts/check_component_audit.dart --strict
      description: Verify every exported Liq component has no unresolved audit Fix status.

    audit:showcase:
      run: dart run tooling/scripts/check_showcase_migration.dart
      description: Verify the App Store showcase consumes liqkit_ui instead of duplicated Liquid* components.

    audit:real_previews:
      run: dart run tooling/scripts/check_real_previews.dart
      description: Verify live docs, snippets, and library code render real widget previews.

    audit:real_previews:self_test:
      run: dart run tooling/scripts/check_real_previews_self_test.dart
      description: Verify the real-preview audit catches non-live docs previews.

    audit:showcase_preview_provenance:
      run: dart run tooling/scripts/check_showcase_preview_provenance.dart
      description: Verify README preview images point back to real snippet routes.

    verify:provenance:
      run: dart run tooling/scripts/verify_provenance.dart
      description: Re-hash design_data and assert PROVENANCE.md matches.

    check:no_path_runtime_deps:
      run: bash tooling/scripts/check_no_path_runtime_deps.sh
      description: "CI check that no published package has a runtime path: dep."

    fmt:
      run: dart format .
      description: Format every Dart file in the workspace.

    fmt:check:
      run: dart format --output=none --set-exit-if-changed .
      description: CI check that all Dart files are formatted.

    docs:gen:routes:
      run: dart run tooling/gen/gen_snippet_routes.dart
      description: Regenerate snippet routes (apps/docs_snippets routes.g.dart and apps/docs snippet-routes.ts).

    docs:gen:routes:check:
      run: dart run tooling/gen/gen_snippet_routes.dart --check
      description: CI check that snippet routes are up to date.

    docs:gen:snippets:
      run: dart run tooling/gen/snippet_generator/main.dart
      description: Regenerate JSON code-snippet files under apps/docs/snippets/ from the Dart sources listed in the manifest.

    docs:gen:snippets:check:
      run: dart run tooling/gen/snippet_generator/main.dart --check
      description: CI check that JSON code-snippet files are up to date.
