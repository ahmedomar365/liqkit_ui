<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_liquid_ui_kit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_liquid_ui_kit</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Fix for smooth scrolling on Flutter web */
    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      height: 100%;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
    }
    
    /* Loading Screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
    }
    
    .logo {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    
    .logo-icon {
      width: 60px;
      height: 60px;
      background-image: url('favicon.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: brightness(1.2);
    }
    
    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 1));
      border-radius: 2px;
      animation: loading 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-10px) scale(1.05);
      }
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 0.9;
      }
      50% {
        opacity: 0.6;
      }
    }
    
    @keyframes loading {
      0% {
        width: 0%;
        transform: translateX(-100%);
      }
      50% {
        width: 100%;
        transform: translateX(0%);
      }
      100% {
        width: 100%;
        transform: translateX(100%);
      }
    }
    
    /* Flutter-specific styles */
    /* Fix for momentum scrolling */
    flt-glass-pane {
      -webkit-overflow-scrolling: touch !important;
      overflow-scrolling: touch !important;
    }
    
    /* Prevent scroll jank */
    flt-scene-host {
      touch-action: pan-y !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    
    /* Enable GPU acceleration */
    flt-scene-host canvas {
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* Fix pointer events */
    flt-glass-pane * {
      touch-action: manipulation !important;
      -ms-touch-action: manipulation !important;
    }
    
    /* Mobile responsive */
    @media (max-width: 768px) {
      .logo-container {
        width: 100px;
        height: 100px;
      }
      
      .logo-icon {
        width: 50px;
        height: 50px;
      }
      
      .loading-text {
        font-size: 16px;
      }
      
      .progress-bar {
        width: 160px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo">
        <div class="logo-icon"></div>
      </div>
    </div>
    <div class="loading-text">Flutter Liquid UI Kit</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script>
    // Loading screen management
    function hideLoadingScreen() {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.classList.add('fade-out');
        setTimeout(() => {
          loadingElement.style.display = 'none';
        }, 500);
      }
    }
    
    // Flutter web scrolling performance fixes
    window.addEventListener('load', function() {
      // Enable passive event listeners for better scroll performance
      document.addEventListener('touchstart', function() {}, { passive: true });
      document.addEventListener('touchmove', function() {}, { passive: true });
      document.addEventListener('wheel', function() {}, { passive: true });
      
      // Fix for momentum scrolling
      const scrollElements = document.querySelectorAll('flt-glass-pane');
      scrollElements.forEach(el => {
        el.style.webkitOverflowScrolling = 'touch';
      });
      
      // Reduce scroll lag by disabling scroll anchoring
      if (CSS.supports('overflow-anchor', 'none')) {
        document.body.style.overflowAnchor = 'none';
      }
    });
    
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', hideLoadingScreen);
    
    // Fallback: hide loading screen after a maximum time
    setTimeout(hideLoadingScreen, 8000);
    
    // Override Flutter's scroll behavior for smoother performance
    window.flutterConfiguration = {
      canvasKitVariant: "auto",
      hostElement: document.body,
      renderer: "canvaskit"
    };
    
    // Enhanced Flutter initialization
    window.addEventListener('DOMContentLoaded', function() {
      // Additional setup can go here
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
